<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeArchaeologist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 42px 22px 70px;
    }

    .hero {
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e8eef5;
      color: #34495e;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: 38px;
      line-height: 1.1;
    }

    .subtitle {
      margin: 0;
      color: #637083;
      font-size: 16px;
    }

    .query-card,
    .card {
      background: #fff;
      border: 1px solid #e4e9ef;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(23, 32, 42, .06);
    }

    .query-card {
      padding: 20px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 700;
      color: #45515f;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #ccd5df;
      border-radius: 12px;
      outline: none;
      font: inherit;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: #7b8794;
      box-shadow: 0 0 0 3px rgba(123, 135, 148, .12);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      background: #17202a;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .hint {
      color: #7a8795;
      font-size: 12px;
    }

    .results {
      margin-top: 24px;
    }

    .card {
      padding: 20px;
      margin-top: 16px;
    }

    .card h2,
    .card h3 {
      margin-top: 0;
    }

    .answer {
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .pill {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef2f6;
      color: #43515f;
      font-size: 12px;
      font-weight: 700;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    li {
      margin: 10px 0;
      line-height: 1.5;
    }

    a {
      color: #2457a6;
      word-break: break-word;
    }

    .evidence-item {
      padding: 14px;
      border: 1px solid #e5eaf0;
      border-radius: 12px;
      margin-top: 10px;
    }

    .evidence-item strong {
      display: block;
      margin-bottom: 7px;
    }

    .muted {
      color: #718096;
    }

    .graph-path {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .node {
      padding: 7px 10px;
      border-radius: 9px;
      background: #eef2f6;
      font-size: 13px;
      font-weight: 600;
    }

    .arrow {
      color: #8a96a3;
    }

    .empty {
      color: #7a8795;
      margin: 0;
    }

    .error {
      color: #9b1c1c;
    }

    @media (max-width: 700px) {
      main {
        padding: 28px 14px 50px;
      }

      h1 {
        font-size: 30px;
      }

      .actions {
        align-items: flex-start;
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="hero">
      <span class="badge">Graph-powered code archaeology</span>
      <h1>CodeArchaeologist</h1>
      <p class="subtitle">
        Ask why a piece of code is the way it is — backed by repository evidence.
      </p>
    </section>

    <section class="query-card">
      <label for="question">Your WHY question</label>

      <textarea id="question">Why did Flask 1.0 remove the deprecated flask.ext import namespace instead of keeping it as a compatibility shim?</textarea>

      <div class="actions">
        <button id="ask">Ask Why</button>
        <span class="hint">Evidence is retrieved from the Flask repository graph.</span>
      </div>
    </section>

    <section id="result" class="results"></section>
  </main>

  <script>
    const result = document.getElementById("result");
    const askButton = document.getElementById("ask");
    const questionInput = document.getElementById("question");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderList(items, renderer, emptyText = "None") {
      if (!items || items.length === 0) {
        return `<p class="empty">${escapeHtml(emptyText)}</p>`;
      }

      return `<ul>${items.map(renderer).join("")}</ul>`;
    }

    function renderResult(data) {
      const sources = data.sources || [];
      const evidence = data.evidence || [];
      const people = data.people || [];
      const dates = data.dates || [];
      const graphPath = data.graph_path || [];

      const sourceHtml = renderList(
        sources,
        (source) =>
          `<li><a target="_blank" rel="noopener noreferrer" href="${escapeHtml(source)}">${escapeHtml(source)}</a></li>`
      );

      const evidenceHtml =
        evidence.length === 0
          ? `<p class="empty">No supporting evidence returned.</p>`
          : evidence.map((item) => `
              <div class="evidence-item">
                <strong>${escapeHtml(item.summary || "Evidence")}</strong>
                <div>${escapeHtml(item.rationale || "")}</div>
                ${
                  item.source_url
                    ? `<div style="margin-top:8px">
                         <a target="_blank" rel="noopener noreferrer"
                            href="${escapeHtml(item.source_url)}">
                            Open source
                         </a>
                       </div>`
                    : ""
                }
              </div>
            `).join("");

      const graphHtml =
        graphPath.length === 0
          ? `<p class="empty">No graph path returned.</p>`
          : `
              <div class="graph-path">
                ${graphPath.map((node, index) => `
                  ${index > 0 ? `<span class="arrow">→</span>` : ""}
                  <span class="node">
                    ${escapeHtml(node.label)}: ${escapeHtml(node.key)}
                  </span>
                `).join("")}
              </div>
            `;

      result.innerHTML = `
        <div class="card">
          <div class="meta">
            <span class="pill">Confidence: ${escapeHtml(data.confidence || "unknown")}</span>
            <span class="pill">Mode: ${escapeHtml(data.mode || "unknown")}</span>
          </div>

          <h2>Answer</h2>
          <div class="answer">${escapeHtml(data.answer || "No answer returned.")}</div>
        </div>

        <div class="card">
          <div class="section-title">
            <h3>Supporting sources</h3>
          </div>
          ${sourceHtml}
        </div>

        <div class="card">
          <div class="section-title">
            <h3>Evidence</h3>
            <span class="muted">${evidence.length} item(s)</span>
          </div>
          ${evidenceHtml}
        </div>

        <div class="card">
          <h3>People & dates</h3>
          <p><strong>People:</strong> ${people.length ? people.map(escapeHtml).join(", ") : "None"}</p>
          <p><strong>Dates:</strong> ${dates.length ? dates.map(escapeHtml).join(", ") : "None"}</p>
        </div>

        <div class="card">
          <h3>Graph path</h3>
          ${graphHtml}
        </div>
      `;
    }

    async function askWhy() {
      const question = questionInput.value.trim();

      if (!question) {
        result.innerHTML = `
          <div class="card">
            <p class="error">Please enter a WHY question.</p>
          </div>
        `;
        return;
      }

      askButton.disabled = true;

      result.innerHTML = `
        <div class="card">
          <p class="muted">Searching repository history…</p>
        </div>
      `;

      try {
        const response = await fetch("http://127.0.0.1:8000/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question,
            top_k: 5
          })
        });

        if (!response.ok) {
          throw new Error(`API returned HTTP ${response.status}`);
        }

        const data = await response.json();
        renderResult(data);

      } catch (error) {
        result.innerHTML = `
          <div class="card">
            <h3>Request failed</h3>
            <p class="error">${escapeHtml(error.message)}</p>
            <p class="muted">
              Make sure the FastAPI server is running on
              http://127.0.0.1:8000
            </p>
          </div>
        `;
      } finally {
        askButton.disabled = false;
      }
    }

    askButton.addEventListener("click", askWhy);

    questionInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        askWhy();
      }
    });
  </script>
</body>
</html>
